[package]
name = "quarkstrom"
version = "0.1.0"
edition = "2024"

[dependencies]
# Graphics
wgpu = "27.0.1"
winit = "0.30.12"
winit_input_helper = "0.17.0"

# Gui
egui = "0.33.0"
egui-wgpu = "0.33.0"
egui-winit = { version = "0.33.0" , default-features = false }

# Math
ultraviolet = "0.10.0"
fastrand = "2.3.0"

# Other
bytemuck = { version = "1.24.0", features = [ "derive" ] }
pollster = "0.4.0"
once_cell = "1.21.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.89"
web-sys = "0.3.81"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen-futures = "0.4.54"
